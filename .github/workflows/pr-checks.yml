name: PR rules

# Enforces the team's PR rules (test plan section 8.3 and 15):
#  - PR is raised by the assigned member and gets that person as assignee
#  - title and branch carry the Jira key; title carries a requirement ID
#  - unit-test evidence is ticked in the PR description
#  - after merge: the author must not be the one who merged

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review, closed]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  validate:
    name: PR format
    if: ${{ github.event.action != 'closed' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check title, branch and evidence
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const problems = [];

            if (!/^MSP-\d+: .+/.test(pr.title)) {
              problems.push('Title must start with the Jira key, e.g. "MSP-40: ML worker (FR-010, FR-012)".');
            }
            if (!/\b(FR|NFR|SEC|QA|BR)-[A-Z0-9]{2,3}/.test(pr.title)) {
              problems.push('Title must include at least one requirement ID (FR-, NFR-, SEC-, QA- or BR-).');
            }
            if (!/^MSP-\d+-/.test(pr.head.ref)) {
              problems.push('Branch name must start with the Jira key, e.g. "MSP-40-ml-worker".');
            }
            const body = pr.body || '';
            if (!/- \[x\] .*unit-test evidence/i.test(body)) {
              problems.push('Tick the "Unit-test evidence attached" box in the PR description.');
            }

            // The assigned member raises the PR: make the author the PR assignee.
            await github.rest.issues.addAssignees({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.number,
              assignees: [pr.user.login],
            });

            if (problems.length) {
              core.setFailed(problems.map(p => '- ' + p).join('\n'));
            }

  merge-audit:
    name: Author did not merge own PR
    if: ${{ github.event.action == 'closed' && github.event.pull_request.merged == true }}
    runs-on: ubuntu-latest
    steps:
      - name: Flag self-merges
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const merger = pr.merged_by && pr.merged_by.login;
            if (merger && merger === pr.user.login) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                body: 'Process violation: this PR was merged by its own author. ' +
                      'Per the test plan, another repo owner must review and merge. ' +
                      'Please have a second owner review it now and log it in the deviation log.',
              });
              core.setFailed('Author merged their own PR.');
            }
